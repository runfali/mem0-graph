name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/ruff-action@v3
      with:
        version: "0.16.0"
        args: check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # 核心依赖 + 测试件；vector_stores/llms/embeddings 需要重型可选依赖，
    # 与本地跑法一致地排除（见 conftest 与 README）。
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-mock pytest-asyncio fastapi httpx slowapi \
          "passlib[bcrypt]" "python-jose[cryptography]" sqlalchemy alembic psycopg \
          posthog jieba
    - name: Run tests
      env:
        # conftest.py 已提供全部默认种子，这里仅显式声明以示意图
        JWT_SECRET: ci-test-secret
        AUTH_DISABLED: "true"
      run: >
        python -m pytest tests/ -q
        --ignore=tests/vector_stores
        --ignore=tests/llms
        --ignore=tests/embeddings
